<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixed Solar Clock</title><style> *{box-sizing:border-box}body{margin:0;background:#0b1320;color:#e9f1ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(94vw,550px);padding:24px;text-align:center}h1{font-size:25px;margin:0}p{color:#a6b5cb}svg{width:100%;max-width:420px}#digital{font-size:clamp(38px,10vw,64px);font-variant-numeric:tabular-nums;font-weight:650}label{display:block;margin:12px}input{background:#172538;color:white;border:1px solid #52627a;border-radius:7px;padding:8px;width:100px}small{color:#a6b5cb} .stats{display:flex;justify-content:space-around;margin:20px 0;gap:12px}.stats b{display:block;color:#ffd078;font-size:20px}</style><main><h1>Fixed Solar Clock</h1><p>One clock. Every season.</p><svg viewBox="0 0 400 400" aria-label="24 hour clock with daylight arc"><circle cx="200" cy="200" r="180" fill="#101e30"/><circle cx="200" cy="200" r="169" fill="none" stroke="#47658c" stroke-width="13"/><path id="dayarc" fill="none" stroke="#ffc467" stroke-width="13" stroke-linecap="round"/><g id="ticks"/><g id="hands"><line id="hour" x1="200" y1="200" x2="200" y2="104" stroke="#ffc467" stroke-width="7" stroke-linecap="round"/><line id="minute" x1="200" y1="200" x2="200" y2="76" stroke="#e9f1ff" stroke-width="4" stroke-linecap="round"/><line id="second" x1="200" y1="215" x2="200" y2="66" stroke="#54d9c2" stroke-width="2"/><circle cx="200" cy="200" r="7" fill="#e9f1ff"/></g><text x="200" y="253" fill="#a6b5cb" text-anchor="middle" font-size="12">24 HOUR DIAL</text></svg><div id="digital"></div><p id="date"></p><div class="stats"><div>Sunrise<b id="rise"></b></div><div>Daylight<b id="length"></b></div><div>Sunset<b id="set"></b></div></div><label>Fixed UTC offset <input id="offset" type="number" min="-12" max="14" step="0.25" value="-5"></label><label>Latitude <input id="lat" type="number" min="-90" max="90" step="0.01" value="42.40"></label><label>Longitude <input id="lon" type="number" min="-180" max="180" step="0.01" value="-82.19"></label><p><small>Gold = approximate daylight. Blue = night. The clock never applies daylight saving. Solar estimates assume a level horizon; your device supplies UTC time. Minute and second hands use conventional 60-unit sweeps.</small></p></main><script>const $=id=>document.getElementById(id),rad=Math.PI/180,ns='http://www.w3.org/2000/svg';for(let h=0;h<24;h++){let a=h*Math.PI/12,t=document.createElementNS(ns,'text');t.setAttribute('x',200+145*Math.sin(a));t.setAttribute('y',205-145*Math.cos(a));t.setAttribute('text-anchor','middle');t.setAttribute('fill','#cbd8eb');t.setAttribute('font-size','13');t.textContent=String(h).padStart(2,'0');$('ticks').append(t)}const pad=n=>String(n).padStart(2,'0');function fmt(m){m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}function point(m){let a=m*Math.PI/720;return [200+169*Math.sin(a),200-169*Math.cos(a)].join(' ')}function update(){let off=Number($('offset').value),lat=Number($('lat').value),lon=Number($('lon').value);if(![off,lat,lon].every(Number.isFinite)||Math.abs(lat)>90||Math.abs(lon)>180||off< -12||off>14)return;let d=new Date(Date.now()+off*3600000),h=d.getUTCHours(),m=d.getUTCMinutes(),s=d.getUTCSeconds();$('digital').textContent=pad(h)+':'+pad(m)+':'+pad(s);$('date').textContent=d.toLocaleDateString('en-CA',{timeZone:'UTC',dateStyle:'full'})+' · UTC'+(off>=0?'+':'')+off;for(let [id,a] of [['hour',(h+m/60+s/3600)*15],['minute',(m+s/60)*6],['second',s*6]])$(id).setAttribute('transform',`rotate(${a} 200 200)`);let n=(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,1))/86400000+1,g=2*Math.PI/365*(n-1),eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g)),dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g),c=(Math.cos(90.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec)),half=Math.acos(Math.max(-1,Math.min(1,c)))/rad*4,noon=720-4*lon-eq+off*60,r=noon-half,z=noon+half;$('rise').textContent=c>=1||c<=-1?'—':fmt(r);$('set').textContent=c>=1||c<=-1?'—':fmt(z);$('length').textContent=Math.floor(Math.round(2*half)/60)+'h '+pad(Math.round(2*half)%60)+'m';$('dayarc').setAttribute('d',half===0?'':half===720?'M 200 31 A 169 169 0 1 1 200 369 A 169 169 0 1 1 200 31':`M ${point(r)} A 169 169 0 ${half>360?1:0} 1 ${point(z)}`)}update();setInterval(update,250);document.querySelectorAll('input').forEach(el=>el.addEventListener('input',update));</script></html>
